<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>EP Cube × MicroVPP Winter Grid Program</title>
    <link rel="canonical" href="https://www.microvpp.com/ep_cube.html" />
    <!-- The customer's details are handed to ep_cube.html through sessionStorage
         (same key its head script uses) so they are not requested in a URL again. -->
    <script>
        (function () {
            var PII_KEYS = ['email', 'sn', 'serial', 'serial_number', 'device_id', 'deviceId', 'name', 'phone', 'city'];
            var search = window.location.search;
            var qs = new URLSearchParams(search);
            if (PII_KEYS.some(function (k) { return qs.has(k); })) {
                try {
                    sessionStorage.setItem('ep_cube_signup_qs', search);
                    PII_KEYS.forEach(function (k) { qs.delete(k); });
                    search = qs.toString() ? '?' + qs.toString() : '';
                } catch (_) { /* no storage: pass the query through unchanged */ }
            }
            window.location.replace('../ep_cube.html' + search + window.location.hash);
        })();
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=../ep_cube.html" /></noscript>
</head>
<body>
    <p>Continue to <a href="../ep_cube.html">the EP Cube sign-up page</a>.</p>
</body>
</html>
